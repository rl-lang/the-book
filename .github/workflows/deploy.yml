name: mdBook

on:
  push:
    branches: [master]
    tags: ["v*"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/latest/download/mdbook-x86_64-unknown-linux-gnu.tar.gz | tar -xz
          mv mdbook /usr/local/bin/

      - name: Install mdbook-pdf (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cargo install mdbook-pdf
          sudo apt-get install -y chromium-browser

      - name: Enable PDF output (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        run: echo -e "\n[output.pdf]" >> book.toml

      - name: Build
        run: mdbook build

      - name: Deploy to GitHub Pages (push only)
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./book

      - name: Create Release with PDF (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ./book/output/pdf/output.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
